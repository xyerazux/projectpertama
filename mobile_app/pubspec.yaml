name: task_manager_app
description: "Task Management Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  intl: ^0.20.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^9.0.0
  timezone: ^0.9.4
  ota_update: ^7.1.0
  file_picker: ^10.3.10
  dio: ^5.9.1
  cached_network_image: ^3.4.1
  video_player: ^2.10.1
  mime_type: ^1.0.1
  permission_handler: ^12.0.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
